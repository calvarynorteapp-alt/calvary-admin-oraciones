<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oraciones — Panel de administración</title>
<link rel="manifest" href="./manifest-oraciones.json">
<meta name="theme-color" content="#234E4C">
<link rel="apple-touch-icon" href="../icon-oraciones-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oraciones">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --noche:#234E4C; --arena:#FBF6EE; --arena-2:#F1E7D5;
    --ocaso:#F0965A; --exito:#55B854; --piedra:#7A716A; --texto:#2E2A26; --blanco:#FFFDF9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito Sans',sans-serif;background:var(--arena);color:var(--texto);}
  header{background:var(--noche);color:var(--blanco);padding:18px 20px;}
  header h1{font-family:'Baloo 2',sans-serif;font-size:1.2rem;margin:0;}
  header p{margin:4px 0 0;font-size:.8rem;color:#cfe8e6;}
  main{max-width:720px;margin:0 auto;padding:20px;}

  #gate{max-width:340px;margin:60px auto;background:var(--blanco);border-radius:16px;padding:26px;box-shadow:0 8px 24px rgba(0,0,0,0.1);text-align:center;}
  #gate h2{font-family:'Baloo 2',sans-serif;margin:0 0 6px;color:var(--noche);}
  #gate p{font-size:.85rem;color:var(--piedra);margin:0 0 16px;}
  #gate input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:1rem;text-align:center;letter-spacing:.2em;margin-bottom:12px;}
  #gate button{width:100%;padding:12px;border:none;border-radius:10px;background:var(--ocaso);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;}
  #gateError{color:#c0392b;font-size:.8rem;margin-top:8px;display:none;}

  #app{display:none;}
  .toolbar{display:flex;gap:10px;margin-bottom:16px;align-items:center;flex-wrap:wrap;}
  .toolbar label{font-size:.85rem;color:var(--piedra);display:flex;align-items:center;gap:6px;}
  .toolbar button{background:var(--blanco);border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-size:.8rem;cursor:pointer;}
  .toolbar button:last-child{margin-left:auto;}
  .btnCompartirTodas{background:#DCEFE0;color:#2f6b3a;border-color:#bfe0c8 !important;font-weight:600;}

  .card{background:var(--blanco);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,0.06);}
  .card.estado-atendida{opacity:.6;}
  .card.estado-proceso{border-left:3px solid var(--ocaso);}
  .cardTop{display:flex;justify-content:space-between;gap:10px;}
  .who{font-weight:700;color:var(--noche);font-size:.92rem;}
  .when{font-size:.72rem;color:var(--piedra);}
  .msg{margin:8px 0 12px;font-size:.9rem;line-height:1.5;}
  .actions{display:flex;gap:8px;}
  .actions button{border:none;border-radius:8px;padding:8px 12px;font-size:.8rem;font-weight:600;cursor:pointer;}
  .estadoSelect{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-size:.8rem;margin-bottom:10px;background:var(--blanco);}
  .btnBorrar{background:#F3D7D2;color:#8a2f22;}
  .btnCompartir{background:#DCEFE0;color:#2f6b3a;}
  .empty{text-align:center;color:var(--piedra);padding:40px 0;}
</style>
</head>
<body>

<div id="gate">
  <h2>🙏 Oraciones</h2>
  <p>Panel privado del equipo pastoral. Escribe la clave para continuar.</p>
  <input type="password" id="pinInput" placeholder="Clave" inputmode="numeric">
  <button onclick="enter()">Entrar</button>
  <p id="gateError">Clave incorrecta.</p>
</div>

<div id="app">
  <header>
    <h1>🙏 Peticiones de oración</h1>
    <p>Calvary Culiacán Norte — panel privado</p>
  </header>
  <main>
    <div class="toolbar" style="flex-wrap:wrap;">
      <input type="text" id="searchInput" placeholder="Buscar por nombre o texto..." oninput="render()" style="flex:1;min-width:160px;padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-size:.82rem;">
      <input type="date" id="dateFilter" onchange="render()" style="padding:7px 8px;border-radius:8px;border:1px solid #ddd;font-size:.8rem;">
      <select id="statusFilter" onchange="render()" style="padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-size:.8rem;">
        <option value="todas">Todas</option>
        <option value="pendiente">Pendientes</option>
        <option value="proceso">En proceso</option>
        <option value="atendida">Atendidas</option>
      </select>
      <button class="btnCompartirTodas" id="btnCompartirTodas" onclick="compartirTodas()">Compartir todas</button>
      <button onclick="load()">↻ Actualizar</button>
    </div>
    <div id="list"></div>
  </main>
</div>

<script>
// ------------------------------------------------------------------
// Pega aquí la misma URL /exec que usa tu app pública
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx2y_3cOlk_HaSROXqzIjtyfu9K3FV_IaJnB9DNgg56Woj8nihwE4KUPZHl2UbU4BQX/exec';
// ------------------------------------------------------------------

let PIN = '';
let ROWS = [];

function enter(){
  PIN = document.getElementById('pinInput').value.trim();
  if(!PIN){ return; }
  load();
}

async function load(){
  try{
    const res = await fetch(`${APPS_SCRIPT_URL}?action=admin_oraciones&pin=${encodeURIComponent(PIN)}`, {cache:'no-store'});
    const out = await res.json();
    if(!out.ok){
      document.getElementById('gateError').style.display = 'block';
      document.getElementById('app').style.display = 'none';
      document.getElementById('gate').style.display = 'block';
      return;
    }
    ROWS = out.rows.sort((a,b) => new Date(b.Fecha) - new Date(a.Fecha));
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    render();
  }catch(e){
    alert('No se pudo conectar. Revisa tu conexión a internet.');
  }
}

// El campo "Atendida" ahora guarda uno de 3 valores: 'pendiente',
// 'proceso' o 'atendida'. Esto mantiene compatibilidad con peticiones
// viejas que todavía tengan el valor booleano true/false de antes.
function estadoDe(r){
  const v = r.Atendida;
  if(v === true || v === 'atendida') return 'atendida';
  if(v === 'proceso') return 'proceso';
  return 'pendiente';
}

function filtrar(){
  const texto = document.getElementById('searchInput').value.trim().toLowerCase();
  const fechaFiltro = document.getElementById('dateFilter').value;
  const estadoFiltro = document.getElementById('statusFilter').value;

  return ROWS.filter(r => {
    if(estadoFiltro !== 'todas' && estadoDe(r) !== estadoFiltro) return false;
    if(texto){
      const combinado = ((r.Nombre||'') + ' ' + (r.Peticion||'')).toLowerCase();
      if(!combinado.includes(texto)) return false;
    }
    if(fechaFiltro){
      const f = new Date(r.Fecha);
      if(isNaN(f)) return false;
      const fLocal = f.toISOString().slice(0,10);
      if(fLocal !== fechaFiltro) return false;
    }
    return true;
  });
}

const ESTADO_LABEL = {pendiente:'Pendiente', proceso:'En proceso', atendida:'Atendida'};

function render(){
  const list = document.getElementById('list');
  const items = filtrar();
  if(items.length === 0){
    list.innerHTML = '<div class="empty">No hay peticiones para mostrar.</div>';
  } else {
    list.innerHTML = items.map(r => {
      const estado = estadoDe(r);
      return `
      <div class="card estado-${estado}">
        <div class="cardTop">
          <div class="who">${escapeHtml(r.Nombre || 'Anónimo')}</div>
          <div class="when">${formatDate(r.Fecha)}</div>
        </div>
        <div class="msg">${escapeHtml(r.Peticion || '')}</div>
        <select class="estadoSelect" onchange="setEstado(${r.row}, this.value)">
          <option value="pendiente" ${estado==='pendiente'?'selected':''}>Pendiente</option>
          <option value="proceso" ${estado==='proceso'?'selected':''}>En proceso</option>
          <option value="atendida" ${estado==='atendida'?'selected':''}>Atendida</option>
        </select>
        <div class="actions">
          <button class="btnBorrar" onclick="borrar(${r.row})">Eliminar</button>
          <button class="btnCompartir" onclick="compartir(${r.row})">Compartir</button>
        </div>
      </div>`;
    }).join('');
  }
  updateShareButtonLabel();
}

// Las que se compartirían en "Compartir todas" ahora mismo: respeta los
// filtros activos (búsqueda, fecha, estado) y además limita a los
// últimos 7 días si no hay un filtro de fecha específico puesto.
function sharePool(){
  const fechaFiltro = document.getElementById('dateFilter').value;
  const base = filtrar();
  if(fechaFiltro) return base; // ya está acotado a un día exacto
  const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
  return base.filter(r => {
    const fecha = new Date(r.Fecha);
    return !isNaN(fecha) && fecha.getTime() >= sevenDaysAgo;
  });
}

function updateShareButtonLabel(){
  const btn = document.getElementById('btnCompartirTodas');
  if(!btn) return;
  const count = sharePool().length;
  btn.textContent = `Compartir todas (${count})`;
}

async function setEstado(row, estado){
  await post({action:'mark_atendida', row, estado});
  load();
}
function compartir(row){
  const r = ROWS.find(x => x.row === row);
  if(!r) return;
  const texto = `🙏 Petición de oración\n\n"${r.Peticion}"`;
  shareText(texto);
}

function compartirTodas(){
  const items = sharePool();
  if(items.length === 0){
    alert('No hay peticiones de los últimos 7 días para compartir.');
    return;
  }
  const lista = items.map((r, i) => `${i + 1}. "${r.Peticion}"`).join('\n\n');
  const texto = `🙏 Peticiones de oración de esta semana — Calvary Culiacán Norte\n\n${lista}`;
  shareText(texto);
}

function shareText(texto){
  if(window.AndroidShare && typeof window.AndroidShare.shareText === 'function'){
    window.AndroidShare.shareText(texto);
  } else if(navigator.share){
    navigator.share({text: texto}).catch(() => {});
  } else {
    window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  }
}

async function borrar(row){
  if(!confirm('¿Eliminar esta petición? No se puede deshacer.')) return;
  await post({action:'delete_oracion', row});
  load();
}
async function post(body){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {method:'POST', body: JSON.stringify({...body, pin: PIN})});
    return await res.json();
  }catch(e){
    alert('No se pudo completar la acción.');
  }
}
function formatDate(v){
  const d = new Date(v);
  return isNaN(d) ? '' : d.toLocaleDateString('es-MX', {day:'numeric', month:'short', year:'numeric'});
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key === 'Enter') enter(); });
</script>
</body>
</html>
